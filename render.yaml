# Render — GitHub repo에서 Dockerfile로 배포 (Docker Hub 없이 가능)
# Dashboard: New → Blueprint → 이 repo 연결 → deploy/render 브랜치
services:
  - type: web
    name: mood-code
    runtime: docker
    plan: free
    region: singapore
    branch: deploy/render
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SOCIAL_DEMO_LOGIN
        value: "true"
