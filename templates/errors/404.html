{% extends "base.html" %}

{% block title %}페이지를 찾을 수 없습니다{% endblock %}

{% block content %}

<div class="container" style="text-align:center;padding:80px 0;">

  <h1 style="font-size:64px;font-weight:800;color:var(--color-primary);">404</h1>

  <p style="margin:16px 0 8px;color:var(--color-text-light);">요청하신 페이지를 찾을 수 없습니다.</p>

  <p style="margin:0 0 24px;font-size:13px;color:var(--color-text-light);">

    삭제된 상품이거나 주소가 변경되었을 수 있습니다.

  </p>

  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">

    <a href="{{ url_for('main.index') }}" class="btn btn-primary">홈으로 돌아가기</a>

    <a href="{{ url_for('category.listing', slug='light') }}" class="btn btn-primary">상품목록 보기</a>

  </div>

</div>

{% endblock %}
