<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인테리어 갤러리 메인</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body { background-color: #f5f5f5; color: #111; }

        .ikea-nav {
            background: #fff; border-bottom: 1px solid #ddd; padding: 15px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .ikea-nav .logo { font-weight: bold; font-size: 24px; color: #0058ab; text-decoration: none; }
        .ikea-nav .menu a { margin-left: 20px; text-decoration: none; color: #333; font-size: 14px; }
        .ikea-nav .menu a:hover { color: #0058ab; text-decoration: underline; }

        .gallery-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .gallery-header { margin-bottom: 30px; }
        .gallery-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
        .gallery-header p { font-size: 14px; color: #666; line-height: 1.5; }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .gallery-card {
            background: #fff; cursor: pointer; transition: transform 0.2s ease;
            padding-bottom: 15px; border-radius: 6px; overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        .gallery-card:hover { transform: translateY(-5px); }

        .gallery-img-wrap { width: 100%; height: 280px; overflow: hidden; background: #eef2f5; }
        .gallery-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .gallery-card:hover .gallery-img-wrap img { transform: scale(1.03); }

        .gallery-title { font-size: 18px; font-weight: bold; margin: 20px 20px 0 20px; color: #111; }
    </style>
</head>
<body>

    <main class="gallery-container">
        <div class="gallery-header">
            <h1>인테리어 갤러리</h1>
            <p>원하시는 분위기를 선택해 보세요</p>
        </div>

        <div class="gallery-grid">
            {% for item in gallery_items %}
            <div class="gallery-card" onclick="location.href='{{ item.link if item.link else ('/gallery?category=' ~ item.category) }}'">
                <div class="gallery-img-wrap">
                    <img src="{{ item.image_url }}" alt="{{ item.name }}" onerror="this.parentElement.parentElement.style.display='none';">
                </div>
                <div class="gallery-title">
                    {{ item.name }}
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

</body>
</html>
