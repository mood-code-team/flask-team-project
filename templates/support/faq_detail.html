{% extends "base.html" %}

{% block title %}{{ faq.question }} — 고객센터{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/help-center.css') }}?v=20260801a">
{% endblock %}

{% block content %}
<article class="help-detail">
  <header class="help-detail__header">
    <a href="{{ url_for('support.center', category=faq.category) }}" class="help-center__back" aria-label="고객센터로">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    </a>
    <span class="help-detail__category">{{ category_label }}</span>
    <h1 class="help-detail__question">{{ faq.question }}</h1>
  </header>

  <div class="help-detail__body">
    {{ faq.answer | replace('\n', '<br>') | safe }}
  </div>

  <aside class="help-inquiry help-inquiry--detail">
    <div class="help-inquiry__text">
      <strong>추가로 궁금한 점이 있으신가요?</strong>
      <p>1:1 문의를 남겨주시면 담당자가 확인 후 답변드립니다.</p>
    </div>
    <button type="button" class="help-inquiry__btn" data-inquiry-open>문의하기</button>
  </aside>
</article>
{% endblock %}
