{% if order.can_cancel %}
<form
  class="mypage__cancel-form"
  method="post"
  action="{{ url_for('mypage.order_cancel', order_number=order.order_number) }}"
  data-confirm="주문 {{ order.order_number }}을(를) 취소하시겠습니까?"
>
  <button type="submit" class="mypage__cancel-btn">주문 취소</button>
</form>
{% endif %}
