{# 카카오·Apple 소셜 로그인 버튼
   vars: social_class (optional CSS modifier) #}
<div class="auth-social{% if social_class %} {{ social_class }}{% endif %}">
  <a
    href="{{ url_for('auth.kakao_login', next=next_url|default('')) }}"
    class="auth-social__btn auth-social__btn--kakao{% if not kakao_login_enabled %} is-disabled{% endif %}"
  >
    <span class="auth-social__icon auth-social__icon--kakao" aria-hidden="true">💬</span>
    카카오로 시작하기
  </a>
  <a
    href="{{ url_for('auth.apple_login', next=next_url|default('')) }}"
    class="auth-social__btn auth-social__btn--apple{% if not apple_login_enabled %} is-disabled{% endif %}"
  >
    <span class="auth-social__icon auth-social__icon--apple" aria-hidden="true"></span>
    Apple로 시작하기
  </a>
  {% if social_demo_mode %}
  <p class="auth-social__note auth-social__note--demo">
    데모 모드: 버튼 클릭 시 바로 로그인됩니다. (카카오 콘솔·심사 불필요)
  </p>
  {% endif %}
</div>
