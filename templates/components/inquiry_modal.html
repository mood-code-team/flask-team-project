<div class="inquiry-modal-overlay" id="inquiry-modal-overlay" hidden aria-hidden="true">
  <div class="inquiry-modal" id="inquiry-modal" role="dialog" aria-modal="true" aria-labelledby="inquiry-modal-title">
    <header class="inquiry-modal__header">
      <div class="inquiry-modal__heading">
        <span class="inquiry-modal__badge">고객센터</span>
        <h2 class="inquiry-modal__title" id="inquiry-modal-title">1:1 문의하기</h2>
      </div>
      <button type="button" class="inquiry-modal__close" id="inquiry-modal-close" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </header>

    <form id="inquiry-form" class="inquiry-modal__body" enctype="multipart/form-data">
      <div class="inquiry-modal__row inquiry-modal__row--2">
        <div class="inquiry-field">
          <label class="inquiry-field__label" for="inquiry-type">문의 유형</label>
          <select id="inquiry-type" name="inquiry_type" class="inquiry-field__select" required>
            <option value="">문의 유형 선택</option>
          </select>
        </div>
        <div class="inquiry-field">
          <label class="inquiry-field__label" for="inquiry-order">주문번호 선택</label>
          <select id="inquiry-order" name="order_number" class="inquiry-field__select">
            <option value="">주문번호 선택</option>
          </select>
        </div>
      </div>

      <div class="inquiry-field">
        <label class="inquiry-field__label" for="inquiry-title">제목</label>
        <input
          id="inquiry-title"
          name="title"
          type="text"
          class="inquiry-field__input"
          placeholder="문의 제목을 입력하세요"
          maxlength="200"
          required
        >
      </div>

      <div class="inquiry-field">
        <label class="inquiry-field__label" for="inquiry-content">문의 내용</label>
        <textarea
          id="inquiry-content"
          name="content"
          class="inquiry-field__textarea"
          placeholder="문의 내용을 입력하세요"
          rows="6"
          required
        ></textarea>
      </div>

      <div class="inquiry-field">
        <span class="inquiry-field__label">첨부파일</span>
        <div class="inquiry-attach">
          <label class="inquiry-attach__btn">
            파일 첨부
            <input id="inquiry-files" name="attachments" type="file" class="inquiry-attach__input" multiple accept=".png,.jpg,.jpeg,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx,.zip">
          </label>
          <span class="inquiry-attach__hint">최대 5개, 파일당 10MB</span>
          <ul class="inquiry-attach__list" id="inquiry-file-list"></ul>
        </div>
      </div>

      <p class="inquiry-modal__error" id="inquiry-form-error" hidden></p>

      <footer class="inquiry-modal__footer">
        <button type="button" class="inquiry-modal__btn inquiry-modal__btn--ghost" id="inquiry-cancel-btn">취소</button>
        <button type="submit" class="inquiry-modal__btn inquiry-modal__btn--primary" id="inquiry-submit-btn">접수하기</button>
      </footer>
    </form>
  </div>
</div>
