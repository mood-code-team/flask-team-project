{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card auth-card--simple">
    <h1 class="auth-placeholder__title">{{ title }}</h1>
    <p class="auth-placeholder__message">{{ message }}</p>
    <a href="{{ url_for('auth.login') }}" class="auth-guest">로그인으로 돌아가기</a>
  </div>
</section>
{% endblock %}
